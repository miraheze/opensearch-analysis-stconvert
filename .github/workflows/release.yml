name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to create and release (e.g., 2.19.4)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set Version Environment Variable
        run: echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git tag -a "${{ env.TAG_NAME }}" -m "Released version ${{ env.TAG_NAME }}"
          git push origin "${{ env.TAG_NAME }}"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Package Plugin ZIP
        run: |
          mkdir -p staging_dir
          cp opensearch-analysis-stconvert.jar staging_dir/
          cp plugin-descriptor.properties staging_dir/
          cp LICENSE.txt staging_dir/
          cp NOTICE.txt staging_dir/
          cd staging_dir
          zip -r ../opensearch-analysis-stconvert.zip *
          cd ..

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG_NAME }}" ./opensearch-analysis-stconvert.zip \
            --title "v${{ env.TAG_NAME }}" \
            --notes "Analisys STConvert plugin for OpenSearch version ${{ env.TAG_NAME }}"
